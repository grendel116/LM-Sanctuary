<!-- Sanctuary splash: the pulsing heart shown while the app loads.
     Used by templates/index.html (via include) and by desktop.py (as the window's first page). -->
<style id="critical-splash-styles">
    #chat-loading-overlay {
        position: fixed;
        inset: 0;
        width: 100vw;
        height: 100vh;
        background: #0d0d12;
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 999999;
        transition: opacity 0.4s cubic-bezier(0.25, 1, 0.5, 1), visibility 0.4s;
        opacity: 1;
        visibility: visible;
    }
    #chat-loading-overlay.fade-out {
        opacity: 0;
        visibility: hidden;
        pointer-events: none;
    }
    .splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        animation: splash-pulse 2s infinite ease-in-out;
    }
    .splash-logo {
        width: 72px;
        height: 72px;
        border-radius: 18px;
        background: linear-gradient(135deg, #38bdf8, #818cf8);
        display: flex;
        justify-content: center;
        align-items: center;
        box-shadow: 0 8px 32px rgba(56, 189, 248, 0.35);
    }
    .splash-logo svg {
        width: 38px;
        height: 38px;
        color: #ffffff;
        animation: splash-heart 1.4s infinite ease-in-out;
    }
    @keyframes splash-pulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(0.97); }
    }
    @keyframes splash-heart {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.12); }
    }
</style>
<div id="chat-loading-overlay">
    <div class="splash-content">
        <div class="splash-logo">
            <svg viewBox="0 0 24 24" fill="currentColor">
                <path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/>
            </svg>
        </div>
    </div>
</div>
