    <style id="critical-splash-styles">
        #chat-loading-overlay {
            position: fixed;
            inset: 0;
            background: #121214;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 999999;
            transition: opacity 0.25s ease, visibility 0.25s;
            opacity: 1;
            visibility: visible;
        }
        #chat-loading-overlay.fade-out {
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
        }
        .splash-logo {
            width: 64px;
            height: 64px;
            border-radius: 16px;
            background: rgba(147, 112, 219, 0.14);
            border: 1px solid rgba(147, 112, 219, 0.35);
            box-shadow: 0 8px 32px rgba(147, 112, 219, 0.25);
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .splash-logo svg {
            width: 34px;
            height: 34px;
            color: #a855f7;
        }
    </style>
</head>
